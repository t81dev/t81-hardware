name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-sim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator jq

      - name: Generate vectors
        run: make vectors

      - name: Lint
        run: make lint

      - name: Simulate
        run: make sim

      - name: Emulator RTL parity
        run: make parity
